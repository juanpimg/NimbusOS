#
# pacman.conf del perfil de Nimbus (archiso 91).
#
# Se usa dos veces: mkarchiso lo lee en el HOST para instalar los paquetes del
# live (via -C), y la copia de airootfs/etc/pacman.conf queda en el sistema
# arrancado. Por eso solo usa rutas que existen en ambos: los mirrorlist del
# host (que los paquetes pacman-mirrorlist y cachyos-mirrorlist tambien
# instalan en la imagen) y el repo nimbus en su punto de montaje de la ISO.
#
# Solo repos x86_64 genericos (nada de -v3/-v4): la ISO debe arrancar tambien
# bajo QEMU+TCG (el plan B del harness cuando no hay KVM), cuya CPU qemu64 no
# tiene AVX y moriria con SIGILL ante binarios x86-64-v3.

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[cachyos]
Server = https://cdn77.cachyos.org/repo/$arch/$repo
Server = https://mirror.bali0531.hu/repo/$arch/$repo

# Servidores explicitos: el redirector de la mirrorlist del host sirve a
# veces un borde desfasado (404 en paquetes recien sincronizados) y aborta
# la ISO. Estos dos espejos se verificaron contra el repo; el Include queda
# como alternativa.
[core]
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
Server = https://mirror.leaseweb.com/archlinux/$repo/os/$arch
Include = /etc/pacman.d/mirrorlist

[extra]
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
Server = https://mirror.leaseweb.com/archlinux/$repo/os/$arch
Include = /etc/pacman.d/mirrorlist

[nimbus]
# TODO(bootstrap): el repo local de bootstrap va sin firmar, asi que la
# verificacion se relaja. Cuando el repo publico este alojado y firmado
# (repo de produccion), esto pasa a:
#   SigLevel = Required DatabaseOptional
SigLevel = Optional
Server = file:///run/archiso/bootmnt/nimbus-repo
