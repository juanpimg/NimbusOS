#
# pacman.conf del perfil de Nimbus (archiso 91).
#
# Lo lee mkarchiso en el HOST para instalar los paquetes del live (via -C).
# Usa espejos explicitos (Server =) en vez del mirrorlist del paquete pacman,
# que puede venir vacio o desfasado. Los espejos son los verificados: para
# CachyOS, bali0531 primero (es el unico con el glibc nuevo) y cdn77 segundo;
# para Arch, rackspace y leaseweb.
#
# NO se usa `Include = /etc/pacman.d/mirrorlist`: la mirrorlist del host
# incluye archlinux.cachyos.org, que sirve un borde desfasado (404 en
# paquetes recien sincronizados) y abortaba la construccion de la ISO.
#
# Solo repos x86_64 genericos (nada de -v3/-v4): la ISO debe arrancar tambien
# bajo QEMU+TCG (el plan B del harness cuando no hay KVM), cuya CPU qemu64 no
# tiene AVX y moriria con SIGILL ante binarios x86-64-v3. La optimizacion v3
# la decide el instalador sobre el hardware real de destino.
#
# La copia de la sesion live (airootfs/etc/pacman.conf) lleva los MISMOS
# espejos y el MISMO SigLevel: si divergen, el build instala de un sitio y la
# sesion actualiza desde otro.

[options]
HoldPkg     = pacman glibc
Architecture = auto
# Con 5, el CDN de CachyOS abortaba con HTTP/2 stream reset (PROTOCOL_ERROR).
ParallelDownloads = 3
# SigLevel = Required (lo que trae Arch por defecto) es
# PackageRequired + PackageTrustedOnly. PackageTrustedOnly exige que la clave
# del empaquetador tenga confianza ULTIMATE en el keyring local, y un keyring
# recien poblado no la alcanza: las firmas cruzadas de las claves maestras de
# Arch son SHA-1, que gpg 2.4+ rechaza, asi que la validez se queda en 78% y
# TODA firma de paquete sale como "signature is invalid" y la transaccion se
# aborta. PackageRequired sigue exigiendo una firma VALIDA (la clave debe ser
# valida, no revocada y no caducada), que es la garantia real: un paquete
# manipulado o falsificado sigue rechazandose.
#
# El sistema INSTALADO recupera el nivel estricto: el post-instalacion ejecuta
# `pacman-key --populate nimbus` y `pacman-key --refresh-keys`, que vuelve a
# traer las claves maestras con sus firmas cruzadas actuales.
SigLevel    = PackageRequired DatabaseOptional
LocalFileSigLevel = Optional
# CacheDir escribible: mkarchiso usa el del perfil si no es el de por defecto.
CacheDir = /tmp/nimbus-pacman-cache

[cachyos]
Server = https://mirror.bali0531.hu/repo/$arch/$repo
Server = https://cdn77.cachyos.org/repo/$arch/$repo

[core]
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
Server = https://mirror.leaseweb.com/archlinux/$repo/os/$arch

[extra]
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
Server = https://mirror.leaseweb.com/archlinux/$repo/os/$arch

[nimbus]
# TODO(bootstrap): el repo local de bootstrap va sin firmar, asi que la
# verificacion se relaja. Cuando el repo publico este alojado y firmado
# (repo de produccion), esto pasa a:
#   SigLevel = PackageRequired DatabaseOptional
SigLevel = Optional
Server = file:///run/archiso/bootmnt/nimbus-repo
