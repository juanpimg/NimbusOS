#
# pacman.conf de la SESION LIVE de Nimbus (queda en el sistema arrancado).
#
# Lleva los MISMOS espejos explicitos que el pacman.conf del perfil de build
# (iso/profiles/nimbus/pacman.conf): bali0531 primero para CachyOS (es el
# unico con el glibc nuevo), cdn77 segundo; rackspace y leaseweb para Arch.
# Los ficheros airootfs/etc/pacman.d/{mirrorlist,cachyos-mirrorlist} repiten
# esos mismos espejos por si algo usa Include.

[options]
HoldPkg     = pacman glibc
Architecture = auto
# Con 5, el CDN de CachyOS abortaba con HTTP/2 stream reset (PROTOCOL_ERROR).
ParallelDownloads = 3
# Mismo nivel que el pacman.conf del perfil: `Required` (PackageRequired +
# PackageTrustedOnly) exige confianza ULTIMATE para la clave del empaquetador, y
# un keyring recien poblado no la alcanza con gpg 2.4 (las firmas cruzadas SHA-1
# de las maestras de Arch se rechazan), asi que TODA firma de paquete sale como
# invalida. PackageRequired sigue exigiendo una firma VALIDA, que es la garantia
# real. El sistema instalado recupera el nivel estricto con `pacman-key
# --refresh-keys` en el post-instalacion.
SigLevel    = PackageRequired DatabaseOptional
LocalFileSigLevel = Optional

[cachyos]
Server = https://mirror.bali0531.hu/repo/$arch/$repo
Server = https://cdn77.cachyos.org/repo/$arch/$repo

[core]
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
Server = https://mirror.leaseweb.com/archlinux/$repo/os/$arch

[extra]
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
Server = https://mirror.leaseweb.com/archlinux/$repo/os/$arch

# NOTA: sin seccion [nimbus] a proposito. Ese repo solo existe durante el
# build (el host lo sirve por file:// al hacer pacstrap, pero no queda
# dentro de la ISO): con la seccion presente, `pacman -Sy` en la live falla
# con "failed to synchronize all databases" y pacman queda inservible. Los
# paquetes de Nimbus ya vienen instalados; el repo remoto volvera aqui
# cuando este alojado y firmado. Ver el pacman.conf del perfil (build),
# que si lo declara porque lo necesita.
