# Resolver estatico para la construccion de la ISO.
#
# POR QUE ESTA AQUI: el paquete `filesystem` instala /etc/resolv.conf como symlink a
# /run/systemd/resolve/stub-resolv.conf (el stub de systemd-resolved). Pero pacman
# DESCARGA todos los paquetes antes de extrairlos, y durante la descarga ese symlink
# todavia no existe en el chroot: glibc se queda sin nameservers y TODAS las descargas
# fallan con "Resolving timed out after 10000 milliseconds".
#
# El airootfs se copia al chroot ANTES de la transaccion, asi que este fichero estatico
# esta disponible durante la descarga. Despues, `filesystem` lo sustituye por el symlink
# y la sesion live usa el stub de systemd-resolved, que si funciona.
nameserver 1.1.1.1
nameserver 9.9.9.9
options timeout:2 attempts:3
