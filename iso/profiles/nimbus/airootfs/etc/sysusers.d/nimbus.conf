# Grupos suplementarios del usuario live de Nimbus.
#
# POR QUE: /dev/dri/card0 es crw-rw---- root:video. Sin pertenecer al grupo
# video (ni a render ni a input) el compositor no puede abrir el nodo DRM y
# aborta al crear el backend de render:
#   terminate called after throwing an instance of 'std::runtime_error'
#     what():  CBackend::create() failed!
# Verificado en la sesion live real: con estos grupos, Hyprland arranca.
#
# POR QUE AQUI Y NO EN /etc/group: /etc/group lo escribe el scriptlet del
# paquete shadow (que crea los grupos del sistema con groupadd) y el paquete
# filesystem lo reemplaza durante la transaccion. Declararlo aqui es
# idempotente y no depende del orden de los scriptlets: systemd-sysusers se
# encarga de crear lo que falte y de anadir el miembro al grupo.
#
# El tipo "m" (anadir un usuario a un grupo) existe desde systemd v215 y
# crea implicitamente el usuario o el grupo si no existen.
m nimbus video
m nimbus render
m nimbus input
