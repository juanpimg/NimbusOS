# NimbusOS — SDDM 10-nimbus.conf (F2-T02).
# Fuente: docs/plans/research/F2-base.md §2. Drop-in: NO toca
# /usr/lib/sddm/sddm.conf.d/default.conf. Ruling R-LOGIN: SDDM frente a
# plasma-login-manager/greetd (ver docs/plans/evidence/F2-T02.md).
# Instalación ISO: el build copia este fichero a
# /etc/sddm.conf.d/10-nimbus.conf (F2-T06/T08); en dotfiles vive aquí
# como fuente canónica (Ruling: NimbusShell → NimbusOS, una dirección).

[Theme]
Current=nimbus

[Wayland]
# Dónde buscar sesiones Wayland (plasma.desktop).
SessionDir=/usr/share/wayland-sessions

[General]
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot
# Greeter clásico X11 (estable). Wayland experimental solo si el spike
# F2-T08 lo pide: DisplayServer=wayland +
# GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell.
DisplayServer=x11

[Autologin]
# Vacío por defecto. Autologin SOLO en VM de pruebas (F2-T08), creando
# /etc/sddm.conf.d/autologin.conf con:
#   [Autologin]
#   User=nimbus
#   Session=plasma
# Nunca commitear credenciales ni activar autologin en la ISO final.
User=
Session=
