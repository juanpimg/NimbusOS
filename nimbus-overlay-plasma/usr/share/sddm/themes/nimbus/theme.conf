# sddm-nimbus — theme.conf (SDDM QML theme, F2-T02).
# Tipo imagen con fondo propio NPS (R-APPLE: sin activos Apple).
[General]
type=image
background=Background.jpg
# Acento Nimbus = token accent dark #0A84FF (contrato §2.1).
accent=#0A84FF
# Cursor propio del tema (hereda breeze si falta en el sistema live).
cursorTheme=breeze_cursors
cursorSize=24
# Reloj 24h por defecto; el QML lo hace configurable.
clock24h=true
# Usuarios a ocultar en el selector (sistema + sddm).
hideUsers=sddm,nobody,nobody4,systemd-network,systemd-resolve
