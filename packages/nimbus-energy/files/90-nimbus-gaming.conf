# 90-nimbus-gaming.conf — ajuste de ananicy para sesiones de juego.
#
# Esta configuracion se activa solo cuando hay un juego en marcha y se
# desactiva al salir del juego, devolviendo las prioridades al conjunto
# por defecto. `nimbus-anonicy enable` la pone en vigor.
[gaming]
enabled = true
activate_only_with_game = true
deactivate_on_game_exit = true
apply_rules = 50-nimbus-gaming.rules
