# energy-helper.conf — valores por defecto de nimbus-energy.
# profile: economy|balanced|performance (power-profiles-daemon)
# charge-limit: 40-80 u off. El 80 % es el valor por defecto: es lo que
#   hacen los fabricantes de portátiles y lo que alarga la vida de la batería.
# gpu: auto|on-demand|always (nvidia-prime; on-demand por defecto)
profile=balanced
charge-limit=80
gpu=on-demand
