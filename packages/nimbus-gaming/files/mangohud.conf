# Nimbus MangoHud preset: FPS, frame pacing, GPU/CPU load and heat, plus
# memory use. The overlay never spawns child tasks (no task-spawning
# toggles here), for stability and safety.
# This preset has a real consumer: nimbus-gaming-tune exports it as
# MANGOHUD_CONFIGFILE while the game runs. Outside the tune wrapper,
# MangoHud uses its own default/user configuration.
fps
frametime
frame_timing=1
gpu_stats
gpu_temp
gpu_core_clock
gpu_mem_clock
cpu_stats
cpu_temp
ram
vram
vulkan_driver
engine_version
gamemode
throttling_status
present_mode
table_columns=3
font_size=24
position=top-left
toggle_hud=Shift_R+F12
