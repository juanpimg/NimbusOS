# Nimbus gamescope preset: resolution, fullscreen, HDR and upscaling
# defaults. ACTIVE preset under /usr/share/nimbus/gaming: its consumer is
# `nimbus-gaming-session`, which reads it as KEY=VALUE and translates each
# key into gamescope flags (-W/-H/-r/-f/-F/-e/--hdr-enabled/--mangoapp).
# Refresh handling: `NIMBUS_GAMESCOPE_NESTED_REFRESH_AUTO=1` lets the
# session prefer the rate reported by `gamescope-vrr-check`, falling back
# to NIMBUS_GAMESCOPE_REFRESH. VRR itself is NEVER set here: the session
# only passes --adaptive-sync on positive runtime detection (a static flag
# on a panel without support would show no image).
NIMBUS_GAMESCOPE_WIDTH=2560
NIMBUS_GAMESCOPE_HEIGHT=1440
NIMBUS_GAMESCOPE_REFRESH=144
NIMBUS_GAMESCOPE_FULLSCREEN=1
NIMBUS_GAMESCOPE_UPSCALING=fsr
NIMBUS_GAMESCOPE_HDR=0
NIMBUS_GAMESCOPE_STEAM_INTEGRATION=1
NIMBUS_GAMESCOPE_NESTED_REFRESH_AUTO=1
