# Nimbus gamescope preset: resolution, fullscreen, HDR and upscaling
# defaults. Reference preset, shipped INACTIVE under /usr/share/nimbus/gaming:
# nothing applies it automatically (nimbus-gaming-tune does not drive
# gamescope and there is no per-game auto-detection, so these values never
# take effect on their own). Copy the values you need into your own
# gamescope launch flags. Refresh handling is left to runtime display
# detection and is never forced here (a panel without support would
# show no image).
NIMBUS_GAMESCOPE_WIDTH=2560
NIMBUS_GAMESCOPE_HEIGHT=1440
NIMBUS_GAMESCOPE_REFRESH=144
NIMBUS_GAMESCOPE_FULLSCREEN=1
NIMBUS_GAMESCOPE_UPSCALING=fsr
NIMBUS_GAMESCOPE_HDR=0
NIMBUS_GAMESCOPE_STEAM_INTEGRATION=1
NIMBUS_GAMESCOPE_NESTED_REFRESH_AUTO=1
