# SDDM en la ISO live de Nimbus: tema propio + autologin del usuario live.
# En el sistema instalado, nimbus-postinstall sobrescribe este mismo path
# solo con [Theme] (sin autologin: el sistema instalado pide login).
[Autologin]
User=nimbus
Session=hyprland.desktop

[Theme]
Current=nimbus
