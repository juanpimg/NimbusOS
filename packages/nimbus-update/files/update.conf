# Ventana de mantenimiento de nimbus-update (la lee `nimbus-update auto`).
# Horas locales, formato HH:MM de 24 h. REQUIRE_IDLE=1 exige además que no
# haya sesión interactiva (`who` vacío); con usuario activo, `auto` difiere
# el pase a la próxima ventana en vez de interrumpir.
UPDATE_WINDOW_START=02:00
UPDATE_WINDOW_END=05:00
REQUIRE_IDLE=1
