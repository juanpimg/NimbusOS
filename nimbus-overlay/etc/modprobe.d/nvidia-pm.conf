# NimbusOS — NVIDIA RTD3 + modeset (PRIME nativo, sin gestores externos).
# NVreg_DynamicPowerManagement=0x02 = Turing (GTX 16xx / RTX 20xx).
# NOTA: Ampere y posteriores (RTX 30xx+) pueden usar 0x03 para RTD3 más agresivo.
options nvidia NVreg_DynamicPowerManagement=0x02
options nvidia-drm modeset=1
