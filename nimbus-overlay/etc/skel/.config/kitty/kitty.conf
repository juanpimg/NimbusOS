# NimbusOS — kitty estilo macOS (terminal por defecto de MacShell).
font_family Inter
font_size 12.0
adjust_line_height 110%

# Linux/Wayland (P1 2026-10-27): las opciones `macos_*` son inertes fuera de
# macOS (kitty las ignora en Linux) y se eliminaron:
#   macos_titlebar_color -> wayland_titlebar_color (equivalente real: con CSD
#     en Wayland kitty pinta su titlebar; `background` la funde con la ventana,
#     verificado en https://sw.kovygoyal.net/kitty/conf/).
#   macos_option_as_alt -> sin equivalente (en Linux Alt llega nativa; en
#     macOS hacia falta mapear Option a Alt).
#   macos_show_window_title_in, macos_traditional_fullscreen -> sin
#     equivalente (el titulo/fullscreen los gestiona Hyprland; SUPER+F).
#   window_decorations (obsoleta en kitty actual: ahora es
#     hide_window_decorations) -> `no` explicito = conservar la barra nativa
#     (la dibujan hyprbars + CSD de kitty).
wayland_titlebar_color background
hide_window_decorations no
window_padding_width 8
window_border_width 0
draw_minimal_borders no
# Tema oscuro macOS translucido (Terminal Mac): fondo #1D1D1F al 92%.
background_opacity 0.92
dynamic_background_opacity yes

# Cursor estilo macOS: bloque parpadeante suave.
cursor_shape block
cursor_blink_interval 0.6
cursor_stop_blinking_after 0

# Paleta oscura NimbusOS (#1D1D1F / #F5F5F7 / #0A84FF).
background #1D1D1F
foreground #F5F5F7
selection_background #0A84FF
selection_foreground #FFFFFF
cursor #0A84FF
url_color #64D2FF
color0  #48484A
color8  #98989F
color1  #FF453A
color9  #FF6961
color2  #30D158
color10 #30DD5B
color3  #FFD60A
color4  #0A84FF
color12 #409CFF
color5  #BF5AF2
color13 #D18CFF
color6  #64D2FF
color14 #70D7FF
color7  #98989F
color15 #F5F5F7
