# NimbusOS — kitty estilo macOS (terminal por defecto de MacShell).
font_family Inter
font_size 12.0
adjust_line_height 110%

# macOS: círculos del semáforo gestionados por el WM; barra nativa limpia.
macos_titlebar_color background
macos_option_as_alt yes
macos_show_window_title_in all
macos_traditional_fullscreen no
window_decorations TITLEBAR-BUTTONS
window_padding_width 8
window_border_width 0
draw_minimal_borders no
# Tema oscuro macOS translucido (Terminal Mac): fondo #1D1D1F al 92%.
background_opacity 0.92
dynamic_background_opacity yes

# Cursor estilo macOS: bloque parpadeante suave.
cursor_shape block
cursor_blink_interval 0.6
cursor_stop_blinking_after 0

# Paleta oscura NimbusOS (#1D1D1F / #F5F5F7 / #0A84FF).
background #1D1D1F
foreground #F5F5F7
selection_background #0A84FF
selection_foreground #FFFFFF
cursor #0A84FF
url_color #64D2FF
color0  #48484A
color8  #98989F
color1  #FF453A
color9  #FF6961
color2  #30D158
color10 #30DD5B
color3  #FFD60A
color4  #0A84FF
color12 #409CFF
color5  #BF5AF2
color13 #D18CFF
color6  #64D2FF
color14 #70D7FF
color7  #98989F
color15 #F5F5F7
