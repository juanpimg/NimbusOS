# NimbusOS — kitty estilo macOS (terminal por defecto de MacShell).
font_family Inter
font_size 12.0
adjust_line_height 110%

# macOS: círculos del semáforo gestionados por el WM; barra nativa limpia.
macos_titlebar_color background
macos_option_as_alt yes
macos_show_window_title_in all
macos_traditional_fullscreen no
window_decorations TITLEBAR-BUTTONS
window_padding_width 8
window_border_width 0
draw_minimal_borders no

# Cursor estilo macOS: bloque parpadeante suave.
cursor_shape block
cursor_blink_interval 0.6
cursor_stop_blinking_after 0

# Paleta clara NimbusOS (#F5F5F7 / #1D1D1F / #007AFF).
background #F5F5F7
foreground #1D1D1F
selection_background #007AFF
selection_foreground #F5F5F7
cursor #007AFF
url_color #007AFF
color0  #1D1D1F
color8  #6E6E73
color1  #FF3B30
color9  #FF453A
color2  #28C840
color10 #30D158
color3  #FFCC00
color4  #007AFF
color12 #0A84FF
color5  #BF5AF2
color13 #BF5AF2
color6  #64D2FF
color14 #64D2FF
color7  #F5F5F7
color15 #FFFFFF
