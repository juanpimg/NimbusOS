# NimbusOS — flags Electron estilo macOS (P1 2026-10-27).
# Las apps Electron leen este fichero al arrancar (~/.config/electron-flags.conf).
# Aplica SOLO a apps Electron que lo honoran (Code, Discord, etc.); al resto
# no les afecta. Sin esto, Electron cae a XWayland (escalado borroso +
# decoraciones ajenas al tema).
# Equivalente al comportamiento macOS (ventana nativa del compositor):
--ozone-platform-hint=auto
--enable-wayland-ime
