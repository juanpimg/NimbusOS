# NimbusOS — hyprlock estilo macOS (pantalla de bloqueo).
# Fondo: captura de pantalla con blur (como macOS), hora grande en Inter,
# fecha y hint de tecla. Sin avatar externo: el live no trae foto de usuario.

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Hora grande estilo macOS (Inter, fina).
label {
    monitor =
    text = $TIME
    font_family = Inter
    font_size = 96
    color = rgb(245, 245, 247)
    position = 0, 160
    halign = center
    valign = center
}

# Fecha bajo la hora.
label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %-d de %B')"
    font_family = Inter
    font_size = 22
    color = rgb(245, 245, 247)
    position = 0, 60
    halign = center
    valign = center
}

# Hint de tecla (el desbloqueo es con contrasena del usuario).
label {
    monitor =
    text = Pulsa cualquier tecla e introduce tu contraseña
    font_family = Inter
    font_size = 14
    color = rgba(245, 245, 247, 0.75)
    position = 0, -220
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 48
    position = 0, -140
    halign = center
    valign = center
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(0, 122, 255)
    inner_color = rgba(29, 29, 31, 0.75)
    font_color = rgb(245, 245, 247)
    fade_on_empty = false
    placeholder_text = Contraseña
    fail_text = $FAIL <b>($ATTEMPTS)</b>
    check_color = rgb(0, 122, 255)
    fail_color = rgb(255, 69, 58)
    capslock_color = rgb(255, 204, 0)
}
