# =============================================================================
# NimbusOS — 10-shortcuts.conf (Task 3: atajos globales, estilo macOS)
# Importado desde hyprland.conf via `source = ~/.config/hypr/10-shortcuts.conf`.
# REGLA: la tecla Control queda intacta (copiar/pegar del usuario).
# NOTA doble-disparo: estos dos binds son la definicion CANONICA activa.
#   hyprland.conf conserva sus lineas Task 1 equivalentes COMENTADAS como
#   referencia (mismo comando duplicado dispararia dos veces el toggle).
# Switcher con preview: https://github.com/H3rmt/hyprshell
# =============================================================================

# SUPER+ESPACIO = launcher / Spotlight (macshell).
bind = SUPER, SPACE, exec, qs -c MacShell ipc call spotlight toggle

# ALT+TAB = switcher con preview (hyprshell).
# NOTA sesion canonica (divergencia documentada, sin cambio de binds):
#   sesion .conf -> hyprshell switch (esta linea, canonica aqui).
#   sesion Lua (macshell.lua) -> MacShell switcher via qs ipc
#     (`qs -c MacShell ipc call switcher next`).
#   fallback sin hyprshell -> cyclenext (descomentar abajo).
bind = ALT, TAB, exec, hyprshell switch
# Fallback sin hyprshell (descomentar si hyprshell no esta instalado):
# bind = ALT, TAB, cyclenext,

# --- Task workflow-mac: Spaces / Mission Control / fullscreen ------------------
# La tecla Control queda intacta (copiar/pegar): macOS usa Control+flechas para
# Spaces, aqui el equivalente es SUPER+LEFT/RIGHT y SUPER+1..9. Sin atajos con
# Control activos (lo exige verify-store.sh).
# Spaces: ir al escritorio N (como los Spaces de macOS).
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
# Spaces: llevar la ventana activa al escritorio N.
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
# Escritorio anterior/siguiente (equivale a Control+flechas de macOS).
bind = SUPER, LEFT, workspace, -1
bind = SUPER, RIGHT, workspace, +1
# Mission Control (SUPER+W): Ruling Task ventanas-p0 (2026-10-26): overview
# REAL via hyprexpo es imposible (upstream lo elimino por no mantenido
# May-2026, repo standalone 404; `pacman -Si` vacio; AUR solo fork
# `hyprexpose-git` r0-1 sin pin -> rechazado). Sin `overview` en core 0.56
# (`--verify-config`: `Invalid dispatcher`), el fallback verificado es el
# switcher visual de MacShell.
bind = SUPER, W, exec, qs -c MacShell ipc call switcher next
# Launchpad (SUPER+A): MacShell SI tiene vista de apps (MacBar appsPanel:
# grid de 5 columnas por categoria + buscador; se invoca por ipc
# `spotlight apps` -> spotOpen("apps")). Equivale al Launchpad de macOS.
bind = SUPER, A, exec, qs -c MacShell ipc call spotlight apps
# Restaurar minimizar (SUPER+M): toggle inteligente nimbus-minimize-toggle
# (/usr/bin): si la ventana activa vive en special:minimized la devuelve al
# workspace visible (auto-oculta el shelf al vaciarse); si no, abre/cierra
# el shelf de minimizadas. El boton amarillo minimiza; el click en el Dock
# enfoca (abre el shelf con la ventana activa).
bind = SUPER, M, exec, nimbus-minimize-toggle
# Boton verde = pantalla completa; SUPER+SHIFT+F = flotante.
bind = SUPER, F, fullscreen, 0
bind = SUPER SHIFT, F, togglefloating,

# --- Task ui-flows: teclas hardware (volumen/brillo) -> OSD MacBar ------------
# MacBar expone `qs -c MacShell ipc call hardware volumeUp|volumeDown|mute|
# micMute|brightnessUp|brightnessDown`: el shell ajusta PipeWire/brightnessctl,
# muestra su OSD interno y reproduce el pop. Sin swayosd/avizo (duplicarian el
# OSD). `bindel` = pasa en sesion bloqueada + repite al mantener pulsado.
# Sin Control en ningun bind (portapapeles intacto).
bindel = , XF86AudioRaiseVolume, exec, qs -c MacShell ipc call hardware volumeUp
bindel = , XF86AudioLowerVolume, exec, qs -c MacShell ipc call hardware volumeDown
bindl = , XF86AudioMute, exec, qs -c MacShell ipc call hardware mute
bindl = , XF86AudioMicMute, exec, qs -c MacShell ipc call hardware micMute
bindel = , XF86MonBrightnessUp, exec, qs -c MacShell ipc call hardware brightnessUp
bindel = , XF86MonBrightnessDown, exec, qs -c MacShell ipc call hardware brightnessDown

# --- Task ventanas-raton: mover/redimensionar con raton (estilo Mac/Windows) ---
# SUPER+boton izquierdo = mover ventana; SUPER+boton derecho = redimensionar.
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# --- Task resize-teclado: redimensionar con teclado (sin raton) ----------------
# SUPER+SHIFT+flechas = resizeactive por pasos de 40px (`binde`: repetible al
# mantener pulsado; equivale al Lua `hl.dsp.window.resize({relative=true})`).
# Dispatcher verificado en Hyprland 0.56.2 (`hyprland --verify-config`: ok con
# `resizeactive`; nombre invalido responde `Invalid dispatcher`).
binde = SUPER SHIFT, LEFT, resizeactive, -40 0
binde = SUPER SHIFT, RIGHT, resizeactive, 40 0
binde = SUPER SHIFT, UP, resizeactive, 0 -40
binde = SUPER SHIFT, DOWN, resizeactive, 0 40
