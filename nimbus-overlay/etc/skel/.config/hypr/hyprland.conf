# =============================================================================
# NimbusOS — hyprland.conf (modo flotante por defecto + macshell, estilo macOS)
# Task 1: macshell + Hyprland flotante + theming global macOS.
# Upstream shell: https://github.com/0-ss/MacShell (main @ 2026-10-23, MIT)
# Requiere: Hyprland >= 0.55, Quickshell >= 0.3.2, Qt 6.8+.
# NOTA Lua: Hyprland >= 0.55 con `hyprland.lua` IGNORA este .conf para
#   autostart/binds/dispatches Lua (`hl.dsp.*`). Para sesiones Lua, usar el
#   snippet hermano `macshell.lua` (mismo directorio, fiel al upstream).
#   Este .conf es canonico para sesion .conf: bar/Dock/glass/previews OK.
# Reglas globales: todo flotante, sin atajos con la tecla Control,
#   Alt+Tab=switcher, esquinas 12-14px, blur Dual-Kawase, exec-once=macshell.
# Paleta canonica NimbusOS: #F5F5F7 (claro) / #1D1D1F (oscuro) / #007AFF.
# =============================================================================

# --- Imports -----------------------------------------------------------------
# Task 3: atajos canonicos en fichero dedicado (cero binds CTRL-*).
source = ~/.config/hypr/10-shortcuts.conf

# --- Monitor -----------------------------------------------------------------
monitor = ,preferred,auto,1

# --- Entorno -----------------------------------------------------------------
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland
env = QS_ICON_THEME,WhiteSur
# NOTA coherencia: duplicado en macshell/env (QS_ICON_THEME=...); mantener
# ambos iguales — verify-macshell.sh comprueba que coincidan.
env = XCURSOR_THEME,capitaine-cursors-light
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,capitaine-cursors-light
env = HYPRCURSOR_SIZE,24

# --- Autostart ---------------------------------------------------------------
# macshell via wrapper /usr/bin/macshell -> macshell-start (single-instance,
# espera al compositor, auto-restart tras crash). MacBar posee
# org.freedesktop.Notifications: NO ejecutar dunst/mako/swaync ni otras
# barras/docks (waybar, hyprpanel, ags, nwg-dock).
exec-once = macshell
# Task 3 (USB plug&play): agente polkit + automontaje udiskie.
# MacBar es el daemon de notificaciones (org.freedesktop.Notifications, Task1);
# udiskie --notify usa MacBar. Sin swaynotificationcenter (evita doble daemon).
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = udiskie --automount --notify --smart-tray
# (sin exec-once swaynotificationcenter: MacBar posee Notifications)

# --- Input: gestos 1:1 estilo Mission Control ---------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
    }
}

gestures {
    workspace_swipe_distance = 300
    workspace_swipe_touch = true
    workspace_swipe_forever = true
}
# Swipe 3 dedos horizontal = cambiar workspace (Hyprland >= 0.51:
# workspace_swipe/_fingers eliminados, se declara via `gesture`).
gesture = 3, horizontal, workspace

# --- General: flotante por defecto -------------------------------------------
general {
    gaps_in = 8
    gaps_out = 16
    border_size = 2
    col.active_border = rgba(007affee)
    col.inactive_border = rgba(1d1d1f33)
    layout = dwindle
    allow_tearing = false
}

# TODA ventana flotante por defecto (cero tiling para el usuario casual).
window_rule = float, class:^(.*)$

# --- Decoracion macOS: esquinas 12-14px, sombras suaves, blur ---------------
decoration {
    rounding = 13
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 0.98
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 30
        render_power = 3
        color = rgba(00000066)
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = false
    }
}

# --- Animaciones: curvas Bezier suaves estilo macOS ---------------------------
animations {
    enabled = true
    bezier = nimbus, 0.25, 0.1, 0.25, 1
    bezier = nimbusOut, 0.4, 0.0, 0.2, 1

    animation = windows, 1, 5, nimbus, slide
    animation = windowsIn, 1, 5, nimbus, slide
    animation = windowsOut, 1, 4, nimbusOut, slide
    animation = fade, 1, 5, nimbus
    animation = workspaces, 1, 5, nimbus, slide
    animation = layers, 1, 4, nimbus, fade
}

# --- Layerrules: blur sobre las superficies Liquid Glass de macshell ---------
layer_rule = blur, macdock
layer_rule = ignorealpha 0.2, macdock
layer_rule = blur, macspot
layer_rule = ignorealpha 0.05, macspot
layer_rule = blur, macbarbg
layer_rule = ignorealpha 0.05, macbarbg
layer_rule = noanim, macshot

# --- Misc --------------------------------------------------------------------
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

# --- Binds -------------------------------------------------------------------
# PROHIBIDO usar la tecla Control en atajos (portapapeles intacto).
# Super / Super+Espacio = Spotlight - Alt+Tab = switcher con preview.
$macshell_ipc = qs -c MacShell ipc call

# Task 3: definicion canonica ACTIVA en 10-shortcuts.conf (evita doble-disparo
# del toggle si el mismo comando queda bindeado dos veces). Se conservan las
# lineas Task 1 comentadas como referencia — NO borrar.
# bind = SUPER, SPACE, exec, $macshell_ipc spotlight toggle
# bind = ALT, TAB, exec, $macshell_ipc switcher next
bind = SUPER, V, exec, $macshell_ipc spotlight clipboard
bind = SUPER, L, exec, sh ~/.config/quickshell/MacLock/lock-via-ipc.sh
bind = SUPER, Q, killactive,
bind = SUPER, T, exec, kitty
bind = , PRINT, exec, $macshell_ipc screenshot region
