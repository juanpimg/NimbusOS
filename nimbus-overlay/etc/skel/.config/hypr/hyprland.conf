# =============================================================================
# NimbusOS — hyprland.conf (modo flotante por defecto + macshell, estilo macOS)
# Task 1: macshell + Hyprland flotante + theming global macOS.
# Upstream shell: https://github.com/0-ss/MacShell (main @ 2026-10-23, MIT)
# Requiere: Hyprland >= 0.56, Quickshell >= 0.3.2, Qt 6.8+.
# NOTA Lua: Hyprland >= 0.55 con `hyprland.lua` IGNORA este .conf para
#   autostart/binds/dispatches Lua (`hl.dsp.*`). Para sesiones Lua, usar el
#   snippet hermano `macshell.lua` (mismo directorio, fiel al upstream).
#   Este .conf es canonico para sesion .conf: bar/Dock/glass/previews OK.
# Reglas globales: todo flotante, sin atajos con la tecla Control,
#   Alt+Tab=switcher, esquinas 10px, blur Dual-Kawase, exec-once=macshell.
# Paleta canonica NimbusOS: #F5F5F7 (claro) / #1D1D1F (oscuro) / #007AFF.
# =============================================================================

# --- Imports -----------------------------------------------------------------
# Task 3: atajos canonicos en fichero dedicado (cero binds CTRL-*).
source = ~/.config/hypr/10-shortcuts.conf

# --- Monitor -----------------------------------------------------------------
monitor = ,preferred,auto,1

# --- Entorno -----------------------------------------------------------------
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
# Task menu-tienda (2026-10-26): el modulo GTK exporta el menu por D-Bus
# (com.canonical.AppMenu) para el menu global; Qt sin modulo en repos (ver append).
env = GTK_MODULES,appmenu-gtk-module
env = QS_ICON_THEME,WhiteSur
# NOTA coherencia: duplicado en macshell/env (QS_ICON_THEME=...); mantener
# ambos iguales — install.sh --check y el paso [8/8] comprueban que coincidan.
env = XCURSOR_THEME,capitaine-cursors-light
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,capitaine-cursors-light
env = HYPRCURSOR_SIZE,24

# --- Autostart ---------------------------------------------------------------
# macshell via wrapper /usr/bin/macshell -> macshell-start (single-instance,
# espera al compositor, auto-restart tras crash). MacBar posee
# org.freedesktop.Notifications: NO ejecutar dunst/mako/swaync ni otras
# barras/docks (waybar, hyprpanel, ags, nwg-dock).
exec-once = macshell
# Task ui-desktop2: fondo visible al arrancar. hyprpaper queda DESCARTADO como
# daemon: hyprpaper 0.8.4 rompe el IPC con Hyprland 0.56.2 (todo
# `hyprctl hyprpaper ...` devuelve "Invalid hyprpaper request", probado en VM)
# y el fondo quedaba negro aunque el daemon corria. swaybg (sin IPC, una sola
# imagen estatica = nuestro caso) pinta el Sequoia de forma fiable.
exec-once = swaybg -i /usr/share/backgrounds/nimbus/sequoia-light.jpg -m fill
# Task 3 (USB plug&play): agente polkit + automontaje udiskie.
# MacBar es el daemon de notificaciones (org.freedesktop.Notifications, Task1);
# udiskie --notify usa MacBar. Sin swaynotificationcenter (evita doble daemon).
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = udiskie --automount --notify --smart-tray
# (sin exec-once swaynotificationcenter: MacBar posee Notifications)

# --- Input: gestos 1:1 estilo Mission Control ---------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
    }
}

gestures {
    workspace_swipe_distance = 300
    workspace_swipe_touch = true
    workspace_swipe_forever = true
}
# Swipe 3 dedos horizontal = cambiar workspace (Hyprland >= 0.51:
# workspace_swipe/_fingers eliminados, se declara via `gesture`).
gesture = 3, horizontal, workspace
# --- Task fidelidad-macos: 3 dedos arriba/abajo = Mission Control fallback ----
# (switcher visual MacShell; `dispatcher, exec, ...` verificado 0.56.2).
# DIVERGENCIA con Lua: la API hl.gesture no admite dispatcher/exec
# (`unknown action`), alli es swipe-vertical nativo (ver hyprland.lua).
# Pellizco (mostrar escritorio): SKIP (directions in/out invalidas en .conf).
gesture = 3, up, dispatcher, exec, qs -c MacShell ipc call switcher next
gesture = 3, down, dispatcher, exec, qs -c MacShell ipc call switcher next

# --- General: flotante por defecto -------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    # Task ui-win: SIN borde azul (era rgba(007affee)): borde sutil gris 1px
    # estilo macOS (el acento #007AFF queda solo en marca/botones, no en
    # bordes); la sombra suave de `decoration:shadow` da la separacion.
    col.active_border = rgba(0000004d)
    col.inactive_border = rgba(00000033)
    layout = dwindle
    allow_tearing = false

    # Task ventanas-raton: redimension con borde (estilo Mac/Windows) + snap.
    resize_on_border = true
    extend_border_grab_area = 25

    snap {
        enabled = true
        window_gap = 10
        monitor_gap = 10
    }
}

# --- Task barra-resize: la BARRA mueve, los BORDES redimensionan ---------------
# Ruling auditado contra el fuente upstream (tag v0.56.0,
# work/aur-build/hyprland-plugins/src/hyprland-plugins/hyprbars/):
#   * MOVER arrastrando la barra = nativo del plugin, sin opcion que activar
#     (barDeco.cpp: handleDownEvent arma drag-pending dentro de la barra y
#     handleMovement lanza MBIND_MOVE; detalle con lineas en hyprland.lua).
#   * REDIMENSIONAR desde la barra (bordes/esquinas DE LA BARRA) = NO lo
#     soporta hyprbars (unica mencion a resize en su codigo: pre-ajuste
#     tactil al 50% en onTouchMove; sin MBIND_RESIZE ni agarre en la barra).
#   * El resize estilo macOS vive en los BORDES de la ventana, ya configurado
#     arriba y sin cambios: resize_on_border + extend_border_grab_area 25
#     (area de agarre invisible en los bordes) + snap + SUPER+raton y
#     SUPER+SHIFT+flechas (10-shortcuts.conf).
#   * Este .conf (fallback legacy) NO lleva bloque plugin:hyprbars: esas
#     claves solo existen con el .so cargado (sesion Lua via hl.plugin.load)
#     y aqui romperian `hyprland --verify-config`. Opciones fijadas en
#     hyprland.lua: bar_height 28, bar_part_of_window true,
#     bar_precedence_over_border false (defectos auditados).

# TODA ventana flotante por defecto (cero tiling para el usuario casual).
window_rule = float, class:^(.*)$
# Task workflow-mac: centrada + tamano Mac (cabe en 1366x768, proporcionado en 4K).
window_rule = center, class:^(.*)$
window_rule = size 1100 700, class:^(.*)$
# --- Task ventanas-p0: dialogos/filechoosers NO heredan 1100 700 -------------
# La regla `size 1100 700` con `class:^(.*)$` tambien agranda dialogos y
# filechoosers. Excepciones compactas 700x500 (orden posterior = gana):
# clase portal + titulos open/save/choose/select (EN+ES) y autenticacion.
# (Sintaxis verificada con `hyprland --verify-config` en 0.56.2.)
# Paridad con Lua: `modal:1` (wiki Hyprland 0.52: matcher `modal:[0/1]` para
# ventanas modales). NOTA: `--verify-config` acepta cualquier matcher sin
# validar, asi que esta regla descansa en la wiki, no en el verify; en el
# peor caso (matcher ignorado) el fallback vuelve a 1100x700 sin romper nada.
window_rule = size 700 500, class:^(org\.freedesktop\.impl\.portal\.desktop\.(gtk|hyprland)|[Xx]dg-desktop-portal-gtk)$
window_rule = size 700 500, title:^([Oo]pen|[Ss]ave|[Cc]hoose|[Ss]elect|[Ee]xport|[Ii]mport|[Uu]pload|[Aa]ttach|[Aa]brir|[Gg]uardar|[Ee]legir|[Ss]eleccionar|[Ee]xportar|[Ii]mportar|[Aa]djuntar|[Ss]ubir|[Aa]utenticaci|[Aa]uthentication).*
window_rule = size 700 500, modal:1

# --- Task ventanas-p0: fallback con titlebars NATIVAS (paridad Lua) -----------
# La stanza `plugin { hyprbars { } }` VALIDA sin el .so cargado
# (`hyprland --verify-config`: config ok en harness sin plugin) porque las
# claves plugin:* son opacas hasta que el plugin las registra. Paridad con
# hyprland.lua: mismas opciones + 3 semaforos macOS (los botones hyprlang se
# declaran con `hyprbars-button = bgcolor, size, icon, on-click, fgcolor`; el
# on-click viaja por el dispatcher `exec` = shell, igual que en Lua).
# Paridad P1 (2026-10-26): verde = zoom macOS (maximizar, `fullscreen 1`;
# en macOS el verde NO es pantalla completa) y doble-click en la barra
# tambien maximiza. Pantalla completa real SOLO en SUPER+F.
# DIVERGENCIAS documentadas del fallback:
#   * amarilla: la gramatica CSV del boton no admite comas, asi que no se
#     puede expresar `follow = false`; usa el dispatcher nativo
#     `movetoworkspace special:minimized` (el foco sigue a la ventana y el
#     shelf se abre; en Lua el shelf queda oculto). Restaurar igual: SUPER+M.
#   * no_bar: NO se porta (la forma de bloque `hyprbars:no_bar = true`
#     rompe verify-config sin el .so: `config option does not exist`; el
#     fallback muestra doble barra en Nautilus/Firefox). Solo sesion Lua.
#     Task botones-nativos: tampoco se portan las no_bar de ventanas MacShell
#     propias (About/Clock/Settings/Installer: clase org.quickshell +
#     titulos exactos en hyprland.lua): en fallback .conf esas ventanas muestran
#     doble juego (limitacion documentada; sesion Lua canonica).
plugin {
    hyprbars {
        bar_height = 28
        bar_buttons_alignment = left
        # Overlay WindowBar ON (windowBar:true en MacBar): el overlay QML dibuja
        # semaforos 12px + titulo; hyprbars aporta SOLO la tira (fondo+blur+
        # arrastre+doble-click), sin botones ni titulo para no duplicar.
        bar_title_enabled = false
        bar_text_size = 11
        bar_text_font = Inter
        bar_padding = 15
        bar_button_padding = 8
        bar_part_of_window = true
        bar_precedence_over_border = false
        bar_blur = true
        # DIVERGENCIA con Lua (fallback sin interprete `hl.dsp.*`): aqui
        # dispatchers NATIVOS (killactive/fullscreen 1 = paridad con Lua);
        # las formas `hl.dsp.*` solo valen en sesion Lua via `hyprctl dispatch`.
        on_double_click = hyprctl dispatch fullscreen 1
        # (sin hyprbars-button: los dibuja el overlay WindowBar; ver nota Lua)
    }
}

# --- Decoracion macOS: esquinas 10px, sombras suaves, blur ---------------------
decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 30
        render_power = 3
        color = rgba(00000066)
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = false
        # Task fidelidad-macos: vibrancy estilo Mac (espejo hyprlock.conf).
        vibrancy = 0.1696
        vibrancy_darkness = 0.0
    }
}

# --- Animaciones: curvas Bezier suaves estilo macOS ---------------------------
animations {
    enabled = true
    bezier = nimbus, 0.25, 0.1, 0.25, 1
    bezier = nimbusOut, 0.4, 0.0, 0.2, 1

    animation = windows, 1, 5, nimbus, slide
    animation = windowsIn, 1, 5, nimbus, slide
    animation = windowsOut, 1, 4, nimbusOut, slide
    animation = windowsMove, 1, 4, nimbus, slide
    animation = fade, 1, 5, nimbus
    animation = workspaces, 1, 5, nimbus, slide
    animation = specialWorkspace, 1, 4, nimbus, slidevert
    animation = layers, 1, 4, nimbus, fade
}

# --- Layerrules: blur sobre las superficies Liquid Glass de macshell ---------
# RULING p2-final (2026-10-26): notificaciones/OSD sin reglas propias a
# proposito. Investigado en MacBar.qml/MacDock.qml: NO existe namespace
# macnotif/macosd; los popups (NotifBody) y el OSD (osdVisible) viven dentro
# del PanelWindow "macbar", y upstream documenta "the bar itself needs no
# blur rule" (Liquid Glass pinta su propio blur; blur sobre macbar lo
# duplicaria). Solo namespaces reales del codigo; no inventar ninguno.
layer_rule = blur, macdock
layer_rule = ignorealpha 0.2, macdock
layer_rule = noanim, macdock
layer_rule = blur, macspot
layer_rule = ignorealpha 0.05, macspot
layer_rule = noanim, macspot
layer_rule = blur, macbarbg
layer_rule = ignorealpha 0.05, macbarbg
layer_rule = noanim, macbarbg
layer_rule = noanim, macshot

# --- Misc --------------------------------------------------------------------
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

# --- Binds -------------------------------------------------------------------
# PROHIBIDO usar la tecla Control en atajos (portapapeles intacto).
# Super / Super+Espacio = Spotlight - Alt+Tab = switcher con preview.
$macshell_ipc = qs -c MacShell ipc call

# Task 3: definicion canonica ACTIVA en 10-shortcuts.conf (evita doble-disparo
# del toggle si el mismo comando queda bindeado dos veces). Se conservan las
# lineas Task 1 comentadas como referencia — NO borrar.
# bind = SUPER, SPACE, exec, $macshell_ipc spotlight toggle
# bind = ALT, TAB, exec, $macshell_ipc switcher next
bind = SUPER, V, exec, $macshell_ipc spotlight clipboard
bind = SUPER, L, exec, sh ~/.config/quickshell/MacLock/lock-via-ipc.sh
bind = SUPER, Q, killactive,
bind = SUPER, T, exec, kitty
bind = , PRINT, exec, $macshell_ipc screenshot region
