# 90-nimbus.conf — backend gráfico preferente (Wayland+XWayland fallback).
# Leído por systemd --user / Plasma 6.8 al iniciar sesión (environment.d);
# el instalador lo despliega a ~/.config/environment.d/ (requiere relogin).
# Orden: nativo Wayland primero, X11/XCB solo como fallback (XWayland ya
# activo en kwin_wayland --xwayland). En el harness nested se exportan las
# mismas 6 variables para simular la sesión (ver tests/vm/nested-f10xway.sh).
#
# QT_QPA_PLATFORM=wayland;xcb — Qt5/6 (kate, dolphin, konsole, systemsettings,
#   kcalc, gwenview) por Wayland; si falla, XCB vía XWayland. Riesgo: con solo
#   "wayland" una app Qt vieja no arranca; con ";xcb" nunca cuelga, pero una
#   app rota puede caer a XWayland (escalado x1 borroso en HiDPI).
# ELECTRON_OZONE_PLATFORM_HINT=auto (+ electron-flags.conf --ozone-platform-
#   hint=auto) — Electron elige Wayland si puede, XWayland si no. Riesgo: los
#   Electron viejos (<28) ignoran el hint y caen a XWayland igualmente; los
#   muy nuevos con --ozone-platform-hint=auto a veces parpadean con IME.
# MOZ_ENABLE_WAYLAND=1 — Firefox/Wayland nativo (PipeWire, gestos, escalado
#   fraccional). Riesgo: con valor vacío Firefox usa XWayland (video VA-API
#   peor, tearing); con =1 en drivers propietarios viejos puede dar ventana
#   negra (no observado en Intel/AMD del host: ver F10-T06-nested.md).
# GDK_BACKEND=wayland,x11 — GTK3/4 (apps GNOME legacy) por Wayland, X11 como
#   fallback para que nada falle si falta el portal GTK. Riesgo: forzar solo
#   "wayland" rompe el file-chooser en apps sin portal; la lista mantiene CSD
#   GTK intactas (KWin no les impone decoración: ver kwinrc/kwinrulesrc).
# CLUTTER_BACKEND=wayland — Mutter/Clutter legacy (gestores raros) a Wayland.
#   Riesgo: mínimo (pocas apps lo usan); sin esto caen a X11 siempre.
# SDL_VIDEODRIVER=wayland,x11 — juegos/SDL2 por Wayland, X11 fallback.
#   Riesgo: SDL1.2 ignora la variable (siempre XWayland); algún juego viejo
#   a pantalla completa puede necesitar SDL_VIDEODRIVER=x11 manual.
QT_QPA_PLATFORM=wayland;xcb
ELECTRON_OZONE_PLATFORM_HINT=auto
MOZ_ENABLE_WAYLAND=1
GDK_BACKEND=wayland,x11
CLUTTER_BACKEND=wayland
SDL_VIDEODRIVER=wayland,x11
