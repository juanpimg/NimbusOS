[Settings]
# NimbusOS — GTK3 estilo macOS (WhiteSur). Fuente canonica: Inter.
# M6: si WhiteSur-icon-theme (AUR) falta en el live, GTK usa el fallback
#   Papirus (paquete repo-nativo en el append); puede haber un flash breve
#   de iconos al primer arranque hasta que MacShell aplica el tema.
gtk-theme-name = WhiteSur
gtk-icon-theme-name = WhiteSur
gtk-cursor-theme-name = capitaine-cursors-light
gtk-cursor-theme-size = 24
gtk-font-name = Inter 11
gtk-application-prefer-dark-theme = false
