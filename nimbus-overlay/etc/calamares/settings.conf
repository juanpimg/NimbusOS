---
# NimbusOS Calamares settings — secuencia recortada estilo Setup Assistant.
# Base: CachyOS/cachyos-calamares (GPL-3.0). Sin tracking/packagechooserq/notesqml.
modules-search: [ local, /usr/lib/calamares/modules, /usr/share/calamares/modules ]

branding: nimbus
version: "1.0"

prompt-install: false
oem-setup: false

disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

# Instancias de modulo (patron upstream cachyos-calamares: `instances:` mapea
# id -> fichero de config; la secuencia referencia `modulo@id`).
# shellprocess@nimbus_installed = %post del instalado (P0 instalado==live):
# greetd con el usuario real + pamac/flathub + energia, dentro del target.
instances:
  - id:       nimbus_installed
    module:   shellprocess
    config:   shellprocess_nimbus_installed.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - locale
      - keyboard
      - localecfg
      - fstab
      - initcpiocfg
      - initcpio
      - users
      - displaymanager
      - shellprocess@nimbus_installed
      - networkcfg
      - hwclock
      - services-systemd
      - initramfs
      - bootloader
      - umount
  - show:
      - finished
