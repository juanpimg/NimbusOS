---
# NimbusOS Calamares settings — secuencia recortada estilo Setup Assistant.
# Base: CachyOS/cachyos-calamares (GPL-3.0). Sin tracking/packagechooserq/notesqml.
modules-search: [ local, /usr/lib/calamares/modules, /usr/share/calamares/modules ]

branding: nimbus
version: "1.0"

prompt-install: false
oem-setup: false

disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - locale
      - keyboard
      - localecfg
      - fstab
      - initcpiocfg
      - initcpio
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - initramfs
      - bootloader
      - umount
  - show:
      - finished
