---
# NimbusOS Calamares — %post del sistema INSTALADO (P0 instalado==live).
# Instancia shellprocess@nimbus_installed (declarada en settings.conf):
# corre DENTRO del target (dontChroot: false), despues de users (el usuario
# ya existe) y displaymanager (greetd ya habilitado). Ejecuta
# /usr/bin/nimbus-installed-setup (heredado en el target via unpackfs):
#   * regenera /etc/greetd/config.toml con el usuario REAL (${USER} de
#     Calamares; el live trae `liveuser` hardcodeado y el instalado no
#     debe autologuearlo),
#   * fusion pamac.conf + flathub + mask PPD + enable
#     auto-cpufreq/thermald/bluetooth + ensure nimbus-live-setup.service
#     (reintento AUR en el primer arranque con red).
# ${USER} lo sustituye Calamares por el nombre elegido en la pagina users
# (ver doc del modulo shellprocess); si viniera vacio, el script deriva el
# usuario del target (/etc/passwd, primer uid>=1000). Nunca hardcodea nombres.
dontChroot: false
timeout: 300
script:
  - command: /usr/bin/nimbus-installed-setup "${USER}"
    timeout: 300

i18n:
  name: "Finalizando NimbusOS instalado (usuario, tienda, energia)..."
