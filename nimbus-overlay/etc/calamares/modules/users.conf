---
# NimbusOS Calamares — usuarios: grupo wheel (sudo), shell bash,
# sin contrasena de root separada (bloqueada, sudo via wheel).
defaultGroups:
  - wheel
  - video
  - audio
  - optical
  - storage
  - network
  - power
  - users

autologinGroup: autologin
sudoersGroup: wheel

userShell: /bin/bash
availableShells:
  - /bin/bash

# No pedir/establecer contrasena de root.
setRootPassword: false

requireStrongPasswords: false
allowWeakPasswords: true
