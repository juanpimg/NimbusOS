---
# NimbusOS Calamares — particionado: borrado (erase) por defecto, sin
# particionado manual. Swap en fichero. Sistemas btrfs/ext4. EFI 512MiB.
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M

# Flujo por defecto: erase-disk (borrado completo). El particionado manual
# queda deshabilitado para un instalador estilo Setup Assistant.
allowManualPartitioning: false

# Swap en fichero (sin particion dedicada).
userSwapChoices:
  - none
  - reuse
  - file

defaultFileSystemType: "btrfs"
availableFileSystemTypes:
  - "btrfs"
  - "ext4"
