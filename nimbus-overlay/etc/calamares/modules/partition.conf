---
# NimbusOS Calamares — particionado: borrado (erase) por defecto, sin
# particionado manual. Swap en fichero. Sistemas btrfs/ext4. EFI 512MiB.
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512MiB

# Flujo por defecto: erase-disk (borrado completo). El particionado manual
# queda deshabilitado para un instalador estilo Setup Assistant.
# Clave explicita: el modulo partition de Calamares preselecciona "erase"
# (valores validos: none|alongside|erase|replace|manual|custom).
initialPartitioningChoice: erase
allowManualPartitioning: false

# Swap en fichero (sin particion dedicada).
userSwapChoices:
  - none
  - reuse
  - file

defaultFileSystemType: "btrfs"
availableFileSystemTypes:
  - "btrfs"
  - "ext4"

# Ruling calamares-btrfs (2026-10-27, VM live ISO 10.27 + codigo upstream):
# `btrfs subvolume create <root>/@` (mount/main.py via check_call) solo
# devuelve non-zero si (a) el @ YA existe (disco reutilizado sin
# reformatear: reproducido en VM, "File exists" RC=1) o (b) el mount previo
# fallo en silencio (el modulo solo avisa "Cannot mount ..."; la causa real
# esta en session.log). Flujo limpio erase+btrfs verificado RC=0 paso a
# paso en /dev/vda virtio (parted GPT EFI512M+btrfs, mkfs, mount, create @
# + @home/@root/@srv/@cache/@tmp/@log/@swap, umount, remount subvol=@):
# btrfs-progs 7.3 presente, mount.conf = default CachyOS (sin override
# aqui a proposito). Sin causa en nuestra config: NO se toca nada mas;
# workaround = wipefs -a + tabla GPT nueva antes de reintentar, y aportar
# ~/.cache/calamares/session.log completo si persiste.
