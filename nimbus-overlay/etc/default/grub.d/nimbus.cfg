# NimbusOS — GRUB estilo macOS (tema Whitesur VENDOREADO).
# El tema vive en el overlay en /usr/share/grub/themes/whitesur/ (ensamblado
# del pin auditado nimbus-overlay/etc/nimbus/theming/grub-theme.src,
# variante whitesur @1080p, siguiendo install.sh upstream). Este drop-in solo
# fija las referencias que grub-mkconfig lee de /etc/default/grub.d/*.cfg
# en el sistema instalado (grub-mkconfig sumberge /etc/default/grub primero
# y los drop-ins despues: aqui se SOBRESCRIBE sin tocar ficheros del
# paquete grub upstream).
GRUB_THEME=/usr/share/grub/themes/whitesur/theme.txt
# Entradas "CachyOS" -> "NimbusOS": 10_linux nombra el menuentry desde
# $GRUB_DISTRIBUTOR ("${GRUB_DISTRIBUTOR} Linux"); /etc/default/grub trae
# GRUB_DISTRIBUTOR='CachyOS' y este drop-in lo sobrescribe (verificado en
# /usr/bin/grub-mkconfig: los drop-ins de grub.d/ se sumbergen DESPUES).
GRUB_DISTRIBUTOR="NimbusOS"
