# NimbusOS — GRUB estilo macOS (tema Whitesur).
# El tema se provee en el build desde el pin auditado
# nimbus-overlay/etc/nimbus/theming/grub-theme.src
# (vinceliuice/grub-themes, variante whitesur) copiando themes/whitesur a
# /usr/share/grub/themes/whitesur/. Este drop-in solo fija la referencia que
# grub-mkconfig lee de /etc/default/grub.d/*.cfg en el sistema instalado.
GRUB_THEME=/usr/share/grub/themes/whitesur/theme.txt
