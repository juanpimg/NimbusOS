# NimbusOS — auto-cpufreq (plantilla ISO; no se aplica en host de build)
# Decisión auditoría: auto-cpufreq, NO power-profiles-daemon (mask PPD en Task 5).
[charger]
governor = performance
energy_performance_preference = balance_performance
turbo = always
platform_profile = performance

[battery]
governor = powersave
energy_performance_preference = balance_power
turbo = auto
platform_profile = low-power
