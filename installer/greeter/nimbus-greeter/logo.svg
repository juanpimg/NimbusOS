<!-- Nimbus logo: original rounded cloud-disc mark. Not affiliated with any trademark. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fc1a7"/>
      <stop offset="1" stop-color="#1f6f8b"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#disc)"/>
  <g fill="#ffffff">
    <ellipse cx="64" cy="76" rx="34" ry="16"/>
    <circle cx="48" cy="66" r="14"/>
    <circle cx="66" cy="58" r="18"/>
    <circle cx="84" cy="68" r="12"/>
  </g>
</svg>
