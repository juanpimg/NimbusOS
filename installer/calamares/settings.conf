[sequence]
modules:
  welcome
  locale
  partition
  lukspass
  users
  nimbus-appearance
  nimbus-software
  hardware
  bootloader
  nimbus-verify
  finished

[general]
organizationName=Nimbus
organizationDomain=github.com
productName=Nimbus
productVersion=0.1.0
donationURL=https://github.com/juanpimg/NimbusOS

[locale]
locale=es_ES.UTF-8
keyboard=en_US
useSystemLocale=false

[partition]
defaultFileSystemType=ext4
availableFileSystemTypes=ext4
                   btrfs
                   xfs
                   fat32
                   ntfs
                   linuxswap

[lukspass]
required=false

[users]
username=nimbus
hostname=nimbus

[nimbus-appearance]
mode=light
accent=007AFF

[nimbus-software]
profiles=base,gaming

[hardware]
required=true
