#
# Configuracion de Calamares para Nimbus.
#
# FORMATO (Calamares 3.x). Tres partes:
#   modules-search: de donde se buscan los modulos ("local" = /usr/lib/calamares
#       y /etc/calamares/modules).
#   instances: la declaracion de cada paso (id, module y, si hace falta, el
#       fichero de configuracion propio).
#   sequence: la SECUENCIA de la instalacion, que es una lista de GRUPOS:
#       "- show:" (los pasos que ve el usuario) y "- exec:" (las acciones que se
#       ejecutan). NO es una lista plana de modulos: con el formato plano,
#       Calamares aborta con "FATAL: no sequence set".
#
# IMPORTANTE: solo se pueden usar modulos que existan en el build de
# Calamares. En la version de CachyOS que usa Nimbus existen: bootloader,
# displaymanager, finished, fstab, grubcfg, hostinfo, hwclock, initcpio,
# initcpiocfg, initramfs, initramfscfg, keyboard, locale, localecfg,
# luksbootkeyfile, luksopenswaphookcfg, machineid, mount, netinstall,
# packagechooser, packages, partition, summary, users y welcome. **No existen**
# ni "lukspass" ni "hardware" (se quitaron en Calamares 3): si aparecen en la
# secuencia, el instalador aborta con
#   Module "lukspass@lukspass" not found in module search paths.
#
# El orden de los pasos y el porque de cada uno estan en
# docs/ARCHITECTURE.md (seccion "Instalador Calamares").
modules-search: [ local ]

instances:
  - id:       welcome
    module:   welcome
  - id:       locale
    module:   locale
  - id:       keyboard
    module:   keyboard
  # nimbus-dualboot va ANTES de partition: copia la tabla de particiones y
  # detecta Fast Boot, y ambas cosas tienen que ocurrir antes de que Calamares
  # toque el disco.
  - id:       nimbus-dualboot
    module:   nimbus-dualboot
  - id:       partition
    module:   partition
  - id:       users
    module:   users
  - id:       nimbus-appearance
    module:   nimbus-appearance
  - id:       nimbus-software
    module:   nimbus-software
  - id:       summary
    module:   summary
  - id:       bootloader
    module:   bootloader
  # nimbus-bootloader va DESPUES del bootloader de Calamares (necesita el
  # sistema ya montado) y anade las entradas de rollback al menu de arranque.
  - id:       nimbus-bootloader
    module:   nimbus-bootloader
  # nimbus-postinstall deja el sistema listo: repo, keyring, energia, graficos
  # hibridos y actualizaciones automaticas.
  - id:       nimbus-postinstall
    module:   nimbus-postinstall
  - id:       nimbus-verify
    module:   nimbus-verify
  - id:       finished
    module:   finished

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - nimbus-dualboot
      - partition
      - users
      - nimbus-appearance
      - nimbus-software
      - summary
      - bootloader
      - nimbus-bootloader
      - nimbus-postinstall
      - nimbus-verify
      - finished
  - exec:
      - initcpio
      - displaymanager
      - hwclock
      - grubcfg
      - bootloader

branding: nimbus

prompt-install: true

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-and-next-during-exec: true

quit-at-end: false
