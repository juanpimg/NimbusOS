# SPDX-License-Identifier: GPL-3.0-or-later
[sequence]
modules:
  welcome
  locale
  # nimbus-dualboot va ANTES de partition: su trabajo es copiar la tabla de
  # particiones y detectar Fast Boot, y ambas cosas tienen que ocurrir antes
  # de que Calamares toque el disco.
  nimbus-dualboot
  partition
  lukspass
  users
  nimbus-appearance
  nimbus-software
  hardware
  bootloader
  # nimbus-bootloader va DESPUES del bootloader de Calamares (necesita el
  # sistema ya montado) y añade las entradas de rollback al menu de arranque.
  nimbus-bootloader
  # nimbus-postinstall deja el sistema listo: repo, keyring, snapshots,
  # energia, graficos hibridos y actualizaciones automaticas.
  nimbus-postinstall
  nimbus-verify
  finished

[general]
organizationName=Nimbus
organizationDomain=github.com
productName=Nimbus
productVersion=0.1.0
donationURL=https://github.com/juanpimg/NimbusOS

[locale]
locale=es_ES.UTF-8
keyboard=en_US
useSystemLocale=false

[partition]
defaultFileSystemType=ext4
availableFileSystemTypes=ext4
                   btrfs
                   xfs
                   fat32
                   ntfs
                   linuxswap

[lukspass]
required=false

[users]
username=nimbus
hostname=nimbus

[nimbus-appearance]
mode=light
accent=007AFF

[nimbus-software]
profiles=base,gaming

[hardware]
required=true
