#
# Configuracion de Calamares para Nimbus.
#
# FORMATO: Calamares lee este fichero con un parser YAML (Calamares::Settings
# usa YAML::LoadFile). El fichero estaba en formato INI ([sequence] + una
# lista sin guiones), que no es YAML: yaml.safe_load lo rechaza con
# "expected '<document start>', but found '<block mapping start>'" y el
# instalador no arranca. Por eso el formato es el de Calamares de verdad:
# una lista de pasos con '- module: <nombre>'.
sequence:
  - module: welcome
  - module: locale
  # nimbus-dualboot va ANTES de partition: su trabajo es copiar la tabla de
  # particiones y detectar Fast Boot, y ambas cosas tienen que ocurrir antes
  # de que Calamares toque el disco.
  - module: nimbus-dualboot
  - module: partition
  - module: lukspass
  - module: users
  - module: nimbus-appearance
  - module: nimbus-software
  - module: hardware
  - module: bootloader
  # nimbus-bootloader va DESPUES del bootloader de Calamares (necesita el
  # sistema ya montado) y añade las entradas de rollback al menu de arranque.
  - module: nimbus-bootloader
  # nimbus-postinstall deja el sistema listo: repo, keyring, energia,
  # graficos hibridos y actualizaciones automaticas (los timers de
  # snapshots los habilita; la politica y el primer snapshot los pone
  # nimbus-snapshots).
  - module: nimbus-postinstall
  - module: nimbus-verify
  - module: finished

general:
  organizationName: Nimbus
  organizationDomain: github.com
  productName: Nimbus
  productVersion: 0.1.0
  donationURL: https://github.com/juanpimg/NimbusOS

locale:
  locale: es_ES.UTF-8
  keyboard: en_US
  useSystemLocale: false

partition:
  # Btrfs por defecto (spec §4.4, decision D6): es el unico sistema de
  # ficheros con rollback completo (snapshots + entradas extra en el menu
  # de arranque, §4.9). ext4/xfs siguen disponibles, pero el instalador
  # avisa de que en ellos no hay rollback: se instala linux-cachyos-lts
  # como red de seguridad (ver nimbus-bootloader).
  defaultFileSystemType: btrfs
  availableFileSystemTypes:
    - btrfs
    - ext4
    - xfs
    - fat32
    - ntfs
    - linuxswap
  # Layout de subvolumenes que el instalador debe crear en Btrfs.
  # CONTRATO (no inventar otros nombres): lo esperan nimbus-bootloader
  # (entradas con rootflags=subvol=@ y rootflags=subvol=@snapshots/<n>)
  # y nimbus-snapshots (politica bajo /.snapshots):
  #   @          -> /            (raiz del sistema)
  #   @home      -> /home        (datos de usuario; el rollback no los toca)
  #   @snapshots -> /.snapshots  (los gestiona nimbus-snapshots)

lukspass:
  required: false

users:
  username: nimbus
  hostname: nimbus

nimbus-appearance:
  mode: light
  accent: "007AFF"

nimbus-software:
  profiles:
    - base
    - gaming

hardware:
  required: true
