# Configuracion del modulo nimbus-bootloader (Calamares).
[bootloader]
# grub si hay Windows (multiboot), systemd-boot si el disco es Nimbus solo.
default_systemd_boot=true
# Kernel por defecto de Nimbus (CachyOS) y red sin Btrfs.
default_kernel=linux-cachyos
lts_kernel=linux-cachyos-lts
# Solo Btrfs tiene rollback completo (snapshots + entradas extra).
rollback_filesystem=btrfs
