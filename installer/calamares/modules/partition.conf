#
# Configuracion del modulo partition de Calamares 3.x.
#
# OJO: los ficheros de configuracion de los modulos los lee Calamares con su
# parser YAML (no con INI). Un .conf en INI se carga vacio y el modulo usa
# sus valores por defecto en silencio.
#
# Btrfs por defecto (spec §4.4, decision D6): es el unico sistema de
# ficheros con rollback completo (snapshots + entradas extra en el menu de
# arranque, §4.9). xfs/ext4 siguen disponibles, pero sin rollback.
efiSystemPartition:     "/boot"
efiSystemPartitionSize: 2048M
userSwapChoices:
    - none
luksGeneration: luks2
allowZfsEncryption: true
drawNestedPartitions:   false
alwaysShowPartitionLabels: true
initialPartitioningChoice: none
initialSwapChoice: none
defaultFileSystemType:  "btrfs"
defaultPartitionTableType: gpt
availableFileSystemTypes:  ["btrfs","xfs","ext4","f2fs","zfs"]
bootloaderOverrides:
    - name: grub
      allowZfsEncryption: false
      defaultFileSystemType:  "btrfs"
      availableFileSystemTypes:  ["btrfs","xfs","ext4","f2fs","zfs"]
      efiSystemPartition: "/boot/efi"
      efiSystemPartitionSize: 512M
      luksGeneration: luks2
      initialSwapChoice: none
# Layout de subvolumenes que el instalador debe crear en Btrfs.
# CONTRATO (no inventar otros nombres): lo esperan nimbus-bootloader (entradas
# con rootflags=subvol=@ y rootflags=subvol=@snapshots/<n>) y nimbus-snapshots
# (politica bajo /.snapshots):
#   @          -> /            (raiz del sistema)
#   @home      -> /home        (datos de usuario; el rollback no los toca)
#   @snapshots -> /.snapshots  (los gestiona nimbus-snapshots)
