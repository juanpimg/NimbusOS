# SPDX-License-Identifier: GPL-3.0-or-later
name: iso

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar pacman
        run: |
          cat > /etc/pacman.conf <<'EOF'
          [options]
          HoldPkg = pacman glibc
          Architecture = auto
          ParallelDownloads = 3
          SigLevel = Required DatabaseOptional
          LocalFileSigLevel = Optional

          [core]
          Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
          Server = https://mirror.leaseweb.com/archlinux/$repo/os/$arch

          [extra]
          Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
          Server = https://mirror.leaseweb.com/archlinux/$repo/os/$arch

          [cachyos]
          Server = https://mirror.bali0531.hu/repo/$arch/$repo
          Server = https://cdn77.cachyos.org/repo/$arch/$repo
          EOF
      - name: Importar la clave de CachyOS
        # El contenedor es archlinux:latest: trae archlinux-keyring pero NO la
        # clave maestra de CachyOS (882DCFE48E2051D48E2562ABF3B607488DB35A47),
        # que es la que firma su base de datos y sus paquetes (linux-cachyos va
        # ahi). Sin importarla, `pacman -Sy` aborta con
        #   error: cachyos: key "882DCFE..." is unknown
        # y el job entero se cae.
        run: |
          pacman-key --init
          pacman-key --recv-keys 882DCFE48E2051D48E2562ABF3B607488DB35A47
          pacman-key --lsign-key 882DCFE48E2051D48E2562ABF3B607488DB35A47
      - name: Instalar dependencias
        run: |
          # fakeroot y debugedit los necesita makepkg (base-devel): la imagen
          # archlinux:latest es minima y no los trae, y sin ellos makepkg
          # aborta con "Cannot find the fakeroot binary".
          # grub y syslinux los necesita mkarchiso para los dos modos de
          # arranque del perfil (uefi.grub y bios.syslinux): sin grub,
          # "grub-install is not available on this host".
          pacman --config /etc/pacman.conf -Sy --noconfirm --needed \
            archiso repo qemu-desktop sudo fakeroot debugedit grub syslinux
      - name: Crear usuario de compilación
        run: |
          # makepkg se niega a correr como root e iso/build.sh delega
          # en NIMBUS_BUILD_USER via sudo: sin este usuario el build
          # como root (el contenedor corre como root) aborta.
          id builder >/dev/null 2>&1 || useradd -m builder
          echo "NIMBUS_BUILD_USER=builder" >> "$GITHUB_ENV"
      - name: Construir la ISO
        # El contenedor de GitHub NO puede hacer lo que necesita archiso:
        #   - mount: .../airootfs/proc: permission denied (el contenedor
        #     ENMASCARA rutas de /proc y el kernel no permite montar un /proc
        #     nuevo en ese espacio de nombres de montajes), y
        #   - unshare: unshare failed: Operation not permitted (el contenedor
        #     no tiene CAP_SYS_ADMIN).
        # Por eso la CI usa el BANCO ROOTLESS del repo, que hace lo mismo
        # dentro de un espacio de nombres de usuario: es la unica via que
        # funciona sin privilegios. Ver tools/build-iso-rootless.sh.
        run: |
          bash tools/build-iso-rootless.sh --outdir "$RUNNER_TEMP/iso"
      - name: Comprobar el arranque en QEMU
        run: |
          bash tests/integration/boot_live.sh \
            --iso "$RUNNER_TEMP"/iso/nimbus-*.iso --timeout 900
      - name: Subir la ISO
        uses: actions/upload-artifact@v4
        with:
          name: nimbus-iso
          path: ${{ runner.temp }}/iso/*.iso
          if-no-files-found: error
