name: iso

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar pacman
        run: |
          cat > /etc/pacman.conf <<'EOF'
          [options]
          HoldPkg = pacman glibc
          Architecture = auto
          ParallelDownloads = 3
          SigLevel = Required DatabaseOptional
          LocalFileSigLevel = Optional

          [core]
          Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
          Server = https://mirror.leaseweb.com/archlinux/$repo/os/$arch

          [extra]
          Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
          Server = https://mirror.leaseweb.com/archlinux/$repo/os/$arch

          [cachyos]
          Server = https://mirror.bali0531.hu/repo/$arch/$repo
          Server = https://cdn77.cachyos.org/repo/$arch/$repo
          EOF
      - name: Instalar dependencias
        run: |
          pacman --config /etc/pacman.conf -Sy --noconfirm --needed \
            archiso repo qemu-desktop
      - name: Construir la ISO
        run: bash iso/build.sh --outdir "$RUNNER_TEMP/iso" --local-repo
      - name: Comprobar el arranque en QEMU
        run: |
          bash tests/integration/boot_live.sh \
            --iso "$RUNNER_TEMP"/iso/nimbus-*.iso --timeout 900
      - name: Subir la ISO
        uses: actions/upload-artifact@v4
        with:
          name: nimbus-iso
          path: ${{ runner.temp }}/iso/*.iso
