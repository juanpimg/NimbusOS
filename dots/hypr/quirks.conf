layout = floating
no_border_on_floating = true
float_on_open = 2
border_size = 2
gaps_in = 4
gaps_out = 8
animations.enabled = true
general.allow_session_lock_restore = true
cursor.no_hardware_cursors = true
misc.session_lock_restore = true
# El terminal de emergencia (kitty --class emergency) ocupa toda la pantalla
# para que el rescate sea utilizable si el shell de Nimbus no arranca.
windowrule = fullscreen, class:emergency
